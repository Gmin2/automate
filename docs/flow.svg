<svg xmlns="http://www.w3.org/2000/svg" width="980" height="1256" viewBox="0 0 980 1256"><style>.t{font:600 25px Inter,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#2b2a28}.s{font:400 18px Inter,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#57544f}.l{font:400 17px Inter,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#6f6c66}.a{stroke:#9c9993;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}</style><rect width="980" height="1256" fill="#f9f8f5"/><rect x="10" y="10" width="459.0" height="128" rx="14" fill="#ebe9e4"/><g transform="translate(36,34) scale(1.0833333333333333)"><path d="M8 18H16" stroke="#5b7fa6" stroke-width="2" stroke-miterlimit="10" stroke-linecap="square" fill="none"></path><path d="M8 14L11 14" stroke="#5b7fa6" stroke-width="2" stroke-miterlimit="10" stroke-linecap="square" fill="none"></path><path d="M12 2V10H4" stroke="#5b7fa6" stroke-width="2" data-color="color-2" fill="none"></path><path d="M20 22V2H10.5919L4 8.58984V22H20Z" stroke="#5b7fa6" stroke-width="2" data-color="color-2" fill="none"></path></g><text x="76" y="55" class="t">step assembly</text><text x="36" y="92" class="s">every part, how often it is used, where</text><text x="36" y="117" class="s">each copy sits in the world</text><rect x="511.0" y="10" width="459.0" height="128" rx="14" fill="#ebe9e4"/><g transform="translate(537.0,34) scale(2.1666666666666665)"><path d="m1.455.814l9.367,3.422c.447.163.434.801-.019.946l-4.258,1.363-1.363,4.258c-.145.454-.782.467-.946.019L.814,1.455c-.146-.399.242-.787.641-.641Z" fill="none" stroke="#5b7fa6" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"></path></g><text x="577.0" y="55" class="t">picked faces</text><text x="537.0" y="92" class="s">a few faces on one part, by face id on</text><text x="537.0" y="117" class="s">the command line or a click in the viewer</text><line x1="239.5" y1="146" x2="239.5" y2="190" class="a"/><path d="M232.5 181 L239.5 190 L246.5 181" class="a"/><line x1="740.5" y1="146" x2="740.5" y2="190" class="a"/><path d="M733.5 181 L740.5 190 L747.5 181" class="a"/><rect x="10" y="198" width="960" height="104" rx="14" fill="#f8efd3"/><g transform="translate(36,222) scale(1.0833333333333333)"><circle cx="18.5" cy="8.5" r="4.5" fill="none" stroke="#d0702e" stroke-linecap="square" stroke-miterlimit="10" stroke-width="2" data-color="color-2"></circle><rect x="6" y="15" width="7" height="7" rx="1" ry="1" fill="none" stroke="#d0702e" stroke-linecap="square" stroke-miterlimit="10" stroke-width="2"></rect><polygon points="2 10 6 3 10 10 2 10" fill="none" stroke="#d0702e" stroke-linecap="square" stroke-miterlimit="10" stroke-width="2"></polygon></g><text x="76" y="243" class="t">describe every face</text><text x="36" y="280" class="s">plane, cylinder, cone or ball, with its size, axis, outward normal and whether it is a shaft or a hole</text><line x1="239.5" y1="310" x2="239.5" y2="354" class="a"/><path d="M232.5 345 L239.5 354 L246.5 345" class="a"/><line x1="740.5" y1="310" x2="740.5" y2="354" class="a"/><path d="M733.5 345 L740.5 354 L747.5 345" class="a"/><rect x="10" y="362" width="459.0" height="154" rx="14" fill="#f8efd3"/><g transform="translate(36,386) scale(1.0833333333333333)"><path d="M3 3H21V6L14 13V20L10 21.5V13L3 6L3 3Z" stroke="#d0702e" stroke-width="2" stroke-linecap="round" fill="none"></path></g><text x="76" y="407" class="t">complement filter</text><text x="36" y="444" class="s">a flat face needs a flat face facing it,</text><text x="36" y="469" class="s">a shaft needs a hole of the same size,</text><text x="36" y="494" class="s">a cone needs a cone of the same angle</text><rect x="511.0" y="362" width="459.0" height="368" rx="14" fill="#e3ebf3"/><g transform="translate(537.0,386) scale(1.0833333333333333)"><path d="M22 12C22 17.5228 17.5228 22 12 22C6.47715 22 2 17.5228 2 12C2 6.47715 6.47715 2 12 2" stroke="#4a72a8" stroke-width="2" stroke-miterlimit="10" stroke-linecap="square" data-color="color-2" fill="none"></path><path d="M12 12L18 6L17.5 6.5" stroke="#4a72a8" stroke-width="2" stroke-linecap="square" fill="none"></path><path d="M18 12C18 15.3137 15.3137 18 12 18C8.68629 18 6 15.3137 6 12C6 8.68629 8.68629 6 12 6" stroke="#4a72a8" stroke-width="2" stroke-miterlimit="10" stroke-linecap="square" data-color="color-2" fill="none"></path><path d="M18 2V6H22" stroke="#4a72a8" stroke-width="2" stroke-linecap="square" fill="none"></path></g><text x="577.0" y="407" class="t">where it sits now</text><text x="537.0" y="444" class="s">runs next to the search. the picked</text><text x="537.0" y="469" class="s">faces are checked right where the part</text><text x="537.0" y="494" class="s">already is, and a face that touches</text><text x="537.0" y="519" class="s">nothing there is reported</text><text x="537.0" y="544" class="s"></text><text x="537.0" y="569" class="s">the search finds every copy (all three</text><text x="537.0" y="594" class="s">chuck sockets), this side marks the one</text><text x="537.0" y="619" class="s">the key already sits in as in place</text><line x1="239.5" y1="524" x2="239.5" y2="568" class="a"/><path d="M232.5 559 L239.5 568 L246.5 559" class="a"/><rect x="10" y="576" width="459.0" height="154" rx="14" fill="#f8efd3"/><g transform="translate(36,600) scale(1.0833333333333333)"><path d="M12 12V7.5" stroke="#d0702e" stroke-width="2" data-color="color-2" fill="none"></path><path d="M6 16.5V12H18V16.5" stroke="#d0702e" stroke-width="2" data-color="color-2" fill="none"></path><path d="M14.5 2.5L14.5 7.5L9.5 7.5L9.5 2.5L14.5 2.5Z" stroke="#d0702e" stroke-width="2" fill="none"></path><path d="M8.5 16.5L8.5 21.5L3.5 21.5L3.5 16.5L8.5 16.5Z" stroke="#d0702e" stroke-width="2" fill="none"></path><path d="M20.5 16.5L20.5 21.5L15.5 21.5L15.5 16.5L20.5 16.5Z" stroke="#d0702e" stroke-width="2" fill="none"></path></g><text x="76" y="621" class="t">search tree + pose</text><text x="36" y="658" class="s">angles and distances between picked</text><text x="36" y="683" class="s">faces must show up again on the target.</text><text x="36" y="708" class="s">each surviving set gets one rigid move</text><line x1="239.5" y1="738" x2="239.5" y2="782" class="a"/><path d="M232.5 773 L239.5 782 L246.5 773" class="a"/><line x1="740.5" y1="738" x2="740.5" y2="782" class="a"/><path d="M733.5 773 L740.5 782 L747.5 773" class="a"/><rect x="10" y="790" width="960" height="104" rx="14" fill="#f4e4e4"/><g transform="translate(36,814) scale(1.0833333333333333)"><path d="M20.3777 12.9014L21 4.5L20.4499 4.445C17.508 4.1508 14.6445 3.32223 12 2C9.35553 3.32223 6.49199 4.1508 3.55006 4.44499L3 4.5L3.62236 12.9014C3.85658 16.0632 5.73712 18.8685 8.57285 20.2864L12.0001 22L15.4272 20.2864C18.263 18.8685 20.1435 16.0632 20.3777 12.9014Z" stroke="#b5534f" stroke-width="2" stroke-miterlimit="10" stroke-linecap="square" data-color="color-2" fill="none"></path><path d="M9 12L11 14L16 9" stroke="#b5534f" stroke-width="2" stroke-miterlimit="10" stroke-linecap="square" fill="none"></path></g><text x="76" y="835" class="t">checks</text><text x="36" y="872" class="s">faces really overlap, every gap sits inside a band set by the part size, the two solids dont run into each other</text><line x1="239.5" y1="902" x2="239.5" y2="946" class="a"/><path d="M232.5 937 L239.5 946 L246.5 937" class="a"/><rect x="10" y="954" width="960" height="104" rx="14" fill="#f4e4e4"/><g transform="translate(36,978) scale(1.0833333333333333)"><path d="M12 12L8 19" stroke="#b5534f" stroke-width="2" fill="none"></path><path d="M8 5L12.0414 12H20" stroke="#b5534f" stroke-width="2" fill="none"></path><path d="M22.005 11.995L20 12L20.5 11.9987" stroke="#b5534f" stroke-width="2" stroke-miterlimit="10" stroke-linecap="square" fill="none"></path><path d="M12 2V4V3.5" stroke="#b5534f" stroke-width="2" stroke-miterlimit="10" stroke-linecap="square" data-color="color-2" fill="none"></path><path d="M2.005 11.995H4.00001H3.5" stroke="#b5534f" stroke-width="2" stroke-miterlimit="10" stroke-linecap="square" data-color="color-2" fill="none"></path><path d="M12 22V20V20.5" stroke="#b5534f" stroke-width="2" stroke-miterlimit="10" stroke-linecap="square" data-color="color-2" fill="none"></path><path d="M20.6678 16.9957L18.9289 15.9975L19.3625 16.2464" stroke="#b5534f" stroke-width="2" stroke-miterlimit="10" stroke-linecap="square" data-color="color-2" fill="none"></path><path d="M17.0007 3.33728L16.0007 5.06933L16.2507 4.63632" stroke="#b5534f" stroke-width="2" stroke-miterlimit="10" stroke-linecap="square" data-color="color-2" fill="none"></path><path d="M3.34723 6.99573L5.07495 7.99323L4.64193 7.74323" stroke="#b5534f" stroke-width="2" stroke-miterlimit="10" stroke-linecap="square" data-color="color-2" fill="none"></path><path d="M7.00067 20.6577L8.00067 18.9257L7.75067 19.3587" stroke="#b5534f" stroke-width="2" stroke-miterlimit="10" stroke-linecap="square" fill="none"></path><path d="M17.0084 20.6562L16.0016 18.9223L16.2527 19.3547" stroke="#b5534f" stroke-width="2" stroke-miterlimit="10" stroke-linecap="square" data-color="color-2" fill="none"></path><path d="M20.6618 6.99414L18.9298 7.99414L19.3628 7.74414" stroke="#b5534f" stroke-width="2" stroke-miterlimit="10" stroke-linecap="square" data-color="color-2" fill="none"></path><path d="M7.00836 3.33569L8.00586 5.06342L7.75586 4.6304" stroke="#b5534f" stroke-width="2" stroke-miterlimit="10" stroke-linecap="square" fill="none"></path><path d="M3.34137 16.994L5.07343 15.994L4.64041 16.244" stroke="#b5534f" stroke-width="2" stroke-miterlimit="10" stroke-linecap="square" data-color="color-2" fill="none"></path><path d="M12 20C16.4183 20 20 16.4183 20 12C20 7.58172 16.4183 4 12 4C7.58172 4 4 7.58172 4 12C4 16.4183 7.58172 20 12 20Z" stroke="#b5534f" stroke-width="2" stroke-miterlimit="10" stroke-linecap="square" fill="none"></path></g><text x="76" y="999" class="t">what it can still do</text><text x="36" y="1036" class="s">free directions left by the contact: locked, slides, turns, both. a face that closes off the slide is a stop</text><line x1="239.5" y1="1066" x2="239.5" y2="1110" class="a"/><path d="M232.5 1101 L239.5 1110 L246.5 1101" class="a"/><rect x="10" y="1118" width="960" height="128" rx="14" fill="#e5eedb"/><g transform="translate(36,1142) scale(1.0833333333333333)"><path d="M12 2V21" stroke="#4f8a3c" stroke-width="2" stroke-linecap="square" data-color="color-2" fill="none"></path><path d="M19.5 14.5C21.433 14.5 23 12.933 23 11L20 5H19L16 11C16 12.933 17.567 14.5 19.5 14.5Z" stroke="#4f8a3c" stroke-width="2" fill="none"></path><path d="M4.5 14.5C6.433 14.5 8 12.933 8 11L5 5H4L1 11C1 12.933 2.567 14.5 4.5 14.5Z" stroke="#4f8a3c" stroke-width="2" fill="none"></path><path d="M4.5 5H19.5" stroke="#4f8a3c" stroke-width="2" fill="none"></path><path d="M8 21H16" stroke="#4f8a3c" stroke-width="2" stroke-linecap="square" data-color="color-2" fill="none"></path></g><text x="76" y="1163" class="t">every place it fits</text><text x="36" y="1200" class="s">which part and faces, exact or sliding (or too tight), the gap on each face pair, how many ways it drops in,</text><text x="36" y="1225" class="s">json from the command line, painted green and blue in the viewer with a ghost of the part at each match</text></svg>